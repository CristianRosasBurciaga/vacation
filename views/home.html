<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/vacation.js" defer></script>
    <title>Vacation booker</title>
</head>
<body>
    <div id="content-container">
        <header>
            <h1>Book your dream vacation</h1>
        </header>

        <form id="vacation-form" action="/thank-you" method="get">
            <fieldset id="choose-destination">
                <label for="destination">Destination</label>
                <select name="destination" id="destination">
                    <option value="none">Choose a destination...</option>
                    <option value="cancun">Cancún, Mexico</option>
                    <option value="">Tokyo, Japan</option>
                    <option value="">Madrid, Spain</option>
                    <option value="">Moscow, Russia</option>
                    <option value="">Hawaii, USA</option>
                </select>
                <span id="error-destination" class="error">Please choose a destination</span>
            </fieldset>

            <fieldset id="choose-date">
                <label for="date">Departure Date</label>
        <input type="date" id="date" name="date">
            </fieldset>

            <fieldset id="choose-traveler-count">
                <label for="traveler-number">Number of Travelers</label>
                <input type="number" id="traveler-number" name="traverler-number">
                <span id="error-traveler" class="error">Must input number greater than 0</span>
            </fieldset>

            <button type="submit" id="submit">Find My Vacation</button>
        </form>

        <footer>
            <p>Format: GitHub Repository: <a href="https://github.com/CristianRosasBurciaga/vacation">https://github.com/CristianRosasBurciaga/vacation</a></p>
        </footer>
    </div>

</body>
</html>
